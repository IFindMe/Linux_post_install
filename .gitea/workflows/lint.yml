name: gates

on:
  push:
  pull_request:

jobs:
  consistency-and-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the repo gates (gen drift, check, lint)
        run: |
          set -e
          make gen
          git diff --exit-code
          make check
          make lint
